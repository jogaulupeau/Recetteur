name: Recetteur
version: "0.7.1"
slug: recetteur
description: >-
  Vos recettes, le menu de la semaine, la liste de courses et la recette pas à
  pas avec des quantités qui s'ajustent au nombre de personnes.
url: https://github.com/jogaulupeau/recetteur
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto

# L'interface passe par l'ingress : elle apparaît dans la barre latérale de
# Home Assistant, sans port à ouvrir ni mot de passe à gérer.
ingress: true
ingress_port: 8099
panel_icon: mdi:chef-hat
panel_title: Recettes
# Toute la maison doit pouvoir ouvrir une recette ou cocher la liste de courses.
# L'ingress continue d'exiger une session Home Assistant valide.
panel_admin: false

# Autorise l'app à appeler des services Home Assistant, via le jeton du Supervisor :
# todo.add_item (courses), tts.speak / media_player.play_media (alerte des minuteurs) et l'écriture des deux capteurs du menu du jour
# (sensor.recetteur_menu_midi et sensor.recetteur_menu_soir).
homeassistant_api: true

# Serveur MCP (Claude) : port dédié, fermé tant que « mcp_token » est vide. Il n'est pas publié par défaut : pour l'ouvrir au
# réseau local, renseigner un numéro dans l'onglet « Réseau » de l'app. Voir DOCS.md avant de l'exposer au-delà du réseau local.
ports:
  8100/tcp: null
ports_description:
  8100/tcp: "Serveur MCP pour Claude (jeton obligatoire : option mcp_token)"

# Tout ce que l'app écrit va dans /data : il survit aux mises à jour et fait
# partie des sauvegardes Home Assistant.
options:
  portions_defaut: 4
  ha_todo_entity: todo.shopping_list
  alerte_media_player: ""
  alerte_voix: ""
  alerte_son: ""
  ha_publier_menu: true
  ha_lien_base: ""
  ingress_only: true
  mcp_token: ""
  mcp_lecture_seule: false
  log_level: info

schema:
  portions_defaut: int(1,20)
  ha_todo_entity: str
  # Alerte de fin de minuteur sur une enceinte : lecteur + (voix OU son). Vide = pas d'alerte.
  alerte_media_player: str
  alerte_voix: str
  alerte_son: str
  # Publie le menu du jour dans deux capteurs Home Assistant (midi et soir), pour une carte de tableau de bord.
  ha_publier_menu: bool
  # Facultatif : chemin de l'app dans Home Assistant pour les liens des capteurs (par défaut /<identifiant de l'app>, comme dans le menu latéral).
  ha_lien_base: str?
  # Refuse toute connexion qui ne vient pas de l'ingress du Supervisor (recommandation de Home Assistant).
  ingress_only: bool
  # Jeton d'accès du serveur MCP (24 caractères minimum, ex. « openssl rand -hex 24 »). Vide = MCP désactivé.
  mcp_token: password
  # N'expose que les outils de lecture (rechercher, lire, menu, courses…) : Claude ne peut rien modifier.
  mcp_lecture_seule: bool
  log_level: list(trace|debug|info|warning|error|fatal)
